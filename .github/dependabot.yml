version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "com.coveo:fmt-maven-plugin"
      - dependency-name: "com.google.googlejavaformat:google-java-format"
      - dependency-name: "javax.servlet:javax.servlet-api"
      - dependency-name: "javax.servlet.jsp.jstl:javax.servlet.jsp.jstl-api"
      - dependency-name: "jakarta.servlet:jakarta.servlet-api"
      - dependency-name: "jakarta.servlet.jsp:*"
      - dependency-name: "jakarta.servlet.jsp.jstl:*"
      - dependency-name: "jakarta.el:*"
      - dependency-name: "org.mortbay.jasper:apache-el"
      - dependency-name: "org.mortbay.jasper:apache-jsp"
      - dependency-name: "org.apache.lucene:lucene-core"
      - dependency-name: "com.google.appengine:*"
      - dependency-name: "com.google.appengine.*:*"
      - dependency-name: "com.google.cloud.sql:mysql-socket-factory"
      - dependency-name: "org.eclipse.jetty:*"
      - dependency-name: "org.eclipse.jetty.*:*"
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
      - dependency-name: "org.springframework.boot:spring-boot-starter-web"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
